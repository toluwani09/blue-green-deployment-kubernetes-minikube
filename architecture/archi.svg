<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">

  <rect width="900" height="500" fill="#0f172a"></rect>

  <text x="300" y="40" fill="white" font-size="22" font-family="Arial">
    Kubernetes Blue-Green Deployment Architecture
  </text>

  <!-- Users -->
  <rect x="380" y="80" width="140" height="50" fill="#2563eb" rx="10"></rect>
  <text x="425" y="110" fill="white">Users</text>

  <!-- Service -->
  <rect x="340" y="160" width="220" height="60" fill="#f59e0b" rx="10"></rect>
  <text x="400" y="195" fill="black">Kubernetes Service</text>

  <!-- Arrow -->
  <line x1="450" y1="130" x2="450" y2="160" stroke="white"></line>

  <!-- Blue -->
  <rect x="150" y="280" width="220" height="80" fill="#3b82f6" rx="10"></rect>
  <text x="210" y="320" fill="white">Blue Deployment</text>
  <text x="200" y="345" fill="white">(NGINX - v1)</text>

  <!-- Green -->
  <rect x="530" y="280" width="220" height="80" fill="#22c55e" rx="10"></rect>
  <text x="580" y="320" fill="white">Green Deployment</text>
  <text x="575" y="345" fill="white">(HTTPD - v2)</text>

  <!-- Arrows -->
  <line x1="400" y1="220" x2="250" y2="280" stroke="white"></line>
  <line x1="500" y1="220" x2="650" y2="280" stroke="white"></line>

  <!-- Selector Label -->
  <text x="340" y="420" fill="#e2e8f0" font-size="14">
    Traffic routed via label selectors (app=blue / app=green)
  </text>

</svg>