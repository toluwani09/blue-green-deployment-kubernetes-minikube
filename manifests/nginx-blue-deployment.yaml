# =========================
# BLUE DEPLOYMENT (NGINX)
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-blue
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-blue
  template:
    metadata:
      labels:
        app: app-blue
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80